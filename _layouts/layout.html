<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.author }}" />
    <meta name="description" content="{{ site.description }}">

    <!-- Theme: set before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="{{ '/static/img/profile.png' | relative_url }}">

    {% if page.title %}
      <title>{{ page.title }} | {{ site.title }}</title>
      <meta property="og:title" content="{{ page.title | escape }} | Avi N">
    {% else %}
      <title>{{ site.title }}</title>
      <meta property="og:title" content="Avi Nayak">
    {% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/syntax.css' | relative_url }}" />

    <!-- Google Analytics -->
    {% include analytics.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% include header.html %}

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script>
      (function () {
        var root = document.documentElement;
        var themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
          themeToggle.addEventListener('click', function () {
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
          });
        }

        var header = document.querySelector('.site-header');
        var menuToggle = document.getElementById('menu-toggle');
        if (header && menuToggle) {
          menuToggle.addEventListener('click', function () {
            var open = header.getAttribute('data-open') === 'true';
            header.setAttribute('data-open', String(!open));
            menuToggle.setAttribute('aria-expanded', String(!open));
          });
        }
      })();
    </script>
  </body>
</html>
