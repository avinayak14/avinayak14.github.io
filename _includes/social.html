<div class="social">
  {% if site.email %}
  <a class="icon-btn" href="mailto:{{ site.email }}" aria-label="Email">{% include icon.html name="mail" %}</a>
  {% endif %}
  {% if site.twitter %}
  <a class="icon-btn" href="https://x.com/{{ site.twitter }}" target="_blank" rel="noopener" aria-label="X (Twitter)">{% include icon.html name="x" size=16 %}</a>
  {% endif %}
  {% if site.linkedin %}
  <a class="icon-btn" href="https://linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">{% include icon.html name="linkedin" size=17 %}</a>
  {% endif %}
  {% if site.stackoverflow %}
  <a class="icon-btn" href="https://stackoverflow.com/{{ site.stackoverflow }}" target="_blank" rel="noopener" aria-label="Stack Overflow">SO</a>
  {% endif %}
</div>
